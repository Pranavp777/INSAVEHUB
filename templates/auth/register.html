{% extends "base.html" %}

{% block content %}
<div class="container-shell" style="max-width: 480px; padding-top: var(--space-10);">
  <div class="glass-panel reveal-item" style="padding: var(--space-8); text-align: center;">
    <div style="margin-bottom: var(--space-6);">
      <span class="mono-label">ACCOUNT ACCESS</span>
      <h1 style="font-size: 1.75rem; margin-top: var(--space-1);">Register with INSTASAVE HUB</h1>
      <p style="color: var(--text-secondary); font-size: 0.92rem; margin-top: var(--space-2);">
        Register or sign in instantly with Google to save your download history and 24-hour passes across devices.
      </p>
    </div>

    <a href="{% url 'accounts:google_login' %}" class="btn-glass btn-primary btn-block" style="padding: 0.9rem 1.25rem; font-size: 0.95rem; gap: var(--space-3);">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="background: #ffffff; border-radius: 50%; padding: 2px;">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.4 7.4 24 12 24z"/>
      </svg>
      <span>Register with Google</span>
    </a>
  </div>
</div>
{% endblock %}
