{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-shell" style="padding-top: var(--space-4); text-align: center;">
  <div class="glass-panel" style="max-width: 580px; margin: 0 auto; padding: var(--space-6);">
    <h1 style="font-size: 1.5rem; margin-bottom: var(--space-2);">Redirecting to Download Center</h1>
    <p style="color: var(--text-secondary); margin-bottom: var(--space-4);">
      All downloads on INSTASAVE HUB are direct and free.
    </p>
    <a href="{% url 'downloads:interface' %}" class="btn-glass btn-primary">
      Continue to Downloader
    </a>
  </div>
</div>
<script>
  window.location.replace("{% url 'downloads:interface' %}");
</script>
{% endblock %}
