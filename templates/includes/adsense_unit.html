{% if adsense_enabled and adsense_client %}
<div class="adsense-slot-container {{ extra_class|default:'' }}" aria-label="Sponsored Content">
  <div class="adsense-label-bar">
    <span class="adsense-disclosure-label">ADVERTISEMENT</span>
  </div>
  <div class="adsense-ad-viewport">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client|default:'ca-pub-7764836554568456' }}"
         crossorigin="anonymous"></script>
    <!-- ads 1 -->
    <ins class="adsbygoogle"
         style="display:inline-block;width:728px;height:90px"
         data-ad-client="{{ adsense_client|default:'ca-pub-7764836554568456' }}"
         data-ad-slot="{{ ad_slot|default:adsense_ad_slot|default:'8738112208' }}"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>
</div>
{% endif %}
