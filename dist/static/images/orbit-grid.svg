<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="fineGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#0284C7" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <radialGradient id="fadeMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="800" height="800" fill="url(#fadeMask)"/>
    </mask>
  </defs>
  <g mask="url(#gridMask)">
    <rect width="800" height="800" fill="url(#fineGrid)"/>
    <circle cx="400" cy="400" r="180" stroke="#0284C7" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="400" cy="400" r="290" stroke="#0EA5E9" stroke-opacity="0.11" stroke-width="1"/>
    <circle cx="400" cy="400" r="380" stroke="#38BDF8" stroke-opacity="0.09" stroke-width="1"/>
  </g>
</svg>
